[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "felixsoria-jsonlog"
version = "0.1.0"
description = "解析时间标记，排列日志格式的机器可读的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "felixsoria" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://felixsoria.github.io"
Repository = "https://github.com/felixsoria/jsonlog"
Issues = "https://github.com/felixsoria/jsonlog/issues"

[project.scripts]
jsonlog = "jsonlog:main"

[tool.setuptools]
py-modules = ["jsonlog"]
